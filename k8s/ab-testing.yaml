
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    version: blue
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    version: green
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

