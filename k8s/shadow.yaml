
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  labels:
    app: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest-fitness
          image: valli93140/aceest-fitness:v2.1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
spec:
  type: ClusterIP
  selector:
    app: aceest-shadow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

